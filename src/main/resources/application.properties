spring.application.name=FinancialManager

# Importação opcional das variáveis de ambiente a partir do arquivo .env na raiz do projeto
spring.config.import=optional:file:.env[.properties]

# Banco de dados
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/financialmanager}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Segurança / JWT
security.jwt.secret=${JWT_SECRET:${SECURITY_JWT_SECRET:}}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:${SECURITY_JWT_EXPIRATION_MS:86400000}}
security.jwt.issuer=${JWT_ISSUER:${SECURITY_JWT_ISSUER:financial-manager-api}}
